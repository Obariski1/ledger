<div class="loc-toggle">
  <button
    *ngFor="let loc of locations()"
    class="loc-btn"
    [class.active]="loc === currentLocation()"
    (click)="switchLocation(loc)">
    {{ data.program()[loc].label }}
  </button>
</div>

<div class="day-tabs">
  <div
    *ngFor="let key of dayKeys"
    class="day-tab"
    [class.active]="key === currentDay()"
    (click)="switchDay(key)">
    {{ data.program()[currentLocation()][key].label }}
    <span class="d">{{ data.program()[currentLocation()][key].day }}</span>
  </div>
</div>

<div *ngFor="let ex of currentExercises(); let i = index" class="ex-card overview-ex-card" [class.completed]="isComplete(i)" (click)="toggleComplete(i)">
  <div class="ex-left">
    <div class="ex-name">{{ ex.name }}</div>
    <div class="ex-target">{{ ex.target }}</div>
  </div>
  <div class="ex-right">
    <div class="load-input-wrap" (click)="$event.stopPropagation()">
      <input
        type="number"
        min="0"
        step="2.5"
        class="load-input"
        [value]="ex.load"
        (input)="updateLoad(i, $any($event.target).value)"
      />
      <span class="load-label">kg</span>
    </div>
    <div class="status-pill" *ngIf="isComplete(i)">Done</div>
  </div>
</div>

<div class="button-row plan-add-wrap">
  <button class="add amber sm" (click)="toggleAddExercise()">
    {{ showAddExercise() ? 'Cancel' : 'Add exercise' }}
  </button>
  <button class="add sm" (click)="toggleDeleteExercise()">
    {{ showDeleteExercise() ? 'Cancel' : 'Delete exercise' }}
  </button>
</div>

<div class="card" *ngIf="showAddExercise()">
  <div class="form-row">
    <input
      type="text"
      placeholder="Exercise name"
      [(ngModel)]="newExerciseName"
    />
  </div>
  <div class="form-row">
    <input
      type="text"
      placeholder="Target (example: 3x10-12)"
      [(ngModel)]="newExerciseTarget"
    />
  </div>
  <div class="form-row">
    <input
      type="number"
      min="0"
      step="2.5"
      placeholder="Starting load (kg)"
      [(ngModel)]="newExerciseLoad"
    />
  </div>
  <div class="form-row">
    <input
      type="text"
      placeholder="Note (optional)"
      [(ngModel)]="newExerciseNote"
    />
  </div>
  <button class="add amber" (click)="createExercise()">Create exercise</button>
</div>

<div class="card" *ngIf="showDeleteExercise()">
  <div class="form-row">
    <select [(ngModel)]="selectedDeleteExerciseIndex">
      <option [ngValue]="null">Select exercise to delete</option>
      <option *ngFor="let ex of currentExercises(); let i = index" [ngValue]="i">
        {{ ex.name }} - {{ ex.target }}
      </option>
    </select>
  </div>
  <button class="add" (click)="deleteSelectedExercise()" [disabled]="selectedDeleteExerciseIndex === null">Delete selected</button>
</div>
